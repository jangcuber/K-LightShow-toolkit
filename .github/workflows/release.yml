name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller K-LightShow_USB_Manager.spec
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/K-LightShow_USB_Manager.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --windowed --name K-LightShow_USB_Manager_Mac usb_manager_mac.py
      - run: cd dist && zip -r K-LightShow_USB_Manager_Mac.zip K-LightShow_USB_Manager_Mac.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/K-LightShow_USB_Manager_Mac.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-exe/K-LightShow_USB_Manager.exe
            macos-app/K-LightShow_USB_Manager_Mac.zip
