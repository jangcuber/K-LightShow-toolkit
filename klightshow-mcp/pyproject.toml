[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klightshow-mcp"
version = "0.1.0"
description = "MCP server that turns a music file into a complete Tesla light show (single car or a whole parking lot)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "numpy>=1.24", "scipy>=1.10", "pillow>=10"]

[project.scripts]
klightshow-mcp = "klightshow_mcp.server:main"
klightshow = "klightshow_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
